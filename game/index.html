<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gilded Vault — a midnight heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a12; }
  #game { position: fixed; display: block; touch-action: none; }

</style>
</head>
<body>
<canvas id="game" aria-label="The Gilded Vault: sneak through the Marlow Gallery, steal the Aurora Star and escape before dawn"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
